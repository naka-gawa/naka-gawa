name: Approve automated PRs

# Auto-approves automated (bot) PRs as the code owner so the required code-owner
# review (.github/CODEOWNERS) is satisfied and auto-merge can proceed.
#
# This is the CLIENT half of the csm-actions/approve-pr-action Client/Server
# model: it never holds the approving token. It asks the server repository
# (approve-pr-server) to approve, and the server validates the PR and approves
# it with the code owner's PAT, which lives only in that server repo.
#
# WHO gets approved is defined in .github/approve-pr.yaml (not in this file);
# the server also requires every commit to be signed and linked to a GitHub user.
#
# Requires in this repository:
#   - vars.APPROVE_PR_APP_ID       (the shared approver GitHub App, issues:write on the server repo)
#   - secrets.APPROVE_PR_PRIVATE_KEY
# See docs/required-status-check.md for the full setup.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  approve:
    if: github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load allowed committers
        id: config
        # yq is pre-installed on GitHub-hosted runners (mikefarah, raw output).
        run: |
          {
            echo 'allowed_committers<<EOF'
            yq '.allowed_committers[]' .github/approve-pr.yaml
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: csm-actions/approve-pr-action@452271472f121d6d2f8e7a0761488d2fcc29b715 # v0.2.0
        with:
          pull_request_number: ${{ github.event.pull_request.number }}
          app_id: ${{ vars.APPROVE_PR_APP_ID }}
          app_private_key: ${{ secrets.APPROVE_PR_PRIVATE_KEY }}
          server_repository_name: approve-pr-server
          allowed_committers: ${{ steps.config.outputs.allowed_committers }}
