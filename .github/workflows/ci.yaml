name: CI

on:
  pull_request:
    branches:
      - main

# Only the `status-check` job is registered as a required status check.
# Add new CI jobs to the reusable workflow (workflow_call_lint.yaml), not here.
# Design: docs/required-status-check.md

permissions: {}

jobs:
  lint:
    uses: ./.github/workflows/workflow_call_lint.yaml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  # The single required status check. Register ONLY this job in the ruleset.
  # Skipped (= passing) when all needed jobs succeed; fails when any fail.
  status-check:
    runs-on: ubuntu-latest
    needs: [lint]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    steps:
      - run: exit 1
