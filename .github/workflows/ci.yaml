name: CI

on:
  pull_request:
    branches:
      - main

# Only the `status-check` job is registered as a required status check.
# Add new CI jobs to the reusable workflow (workflow_call_lint.yaml), not here.
# Design: docs/required-status-check.md

permissions: {}

jobs:
  lint:
    uses: ./.github/workflows/workflow_call_lint.yaml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  # The single required status check. Register ONLY this job in the ruleset.
  # Always runs so it reports an explicit success (green); fails only when a
  # needed job failed or was cancelled.
  status-check:
    runs-on: ubuntu-latest
    needs: [lint]
    if: always()
    steps:
      - name: Fail if any needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
